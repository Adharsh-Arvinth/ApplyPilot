<!DOCTYPE html>
<html lang="en" data-theme="neutral">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta name="theme-color" content="#F4F4F2"/>
  <title>ApplyPilot</title>
  <script>
    // Retire legacy Flutter service workers / caches from earlier builds.
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
    if ('caches' in window) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
    // Apply the saved theme before first paint (no flash). Neutral is the default.
    (function () {
      var themes = ['neutral', 'neutral-dark', 'midnight', 'rose', 'sand', 'ocean'], legacy = { light: 'neutral', dark: 'rose' }, p = 'neutral';
      try { p = localStorage.getItem('ap_theme') || 'neutral'; } catch (e) {}
      p = legacy[p] || p;
      if (p === 'auto') p = matchMedia('(prefers-color-scheme: dark)').matches ? 'neutral-dark' : 'neutral';
      document.documentElement.dataset.theme = themes.indexOf(p) >= 0 ? p : 'neutral';
      // Phones and the Android app: same look, lighter glass, so every frame lands at 90-120 Hz
      if (window.ApplyPilotShell || matchMedia('(pointer: coarse)').matches) document.documentElement.classList.add('lite');
      // Text size, font style and motion preference (Settings › Profile › Appearance)
      try {
        var f = JSON.parse(localStorage.getItem('ap_font') || '{}') || {}, sizes = { s: .9, m: 1, l: 1.12, xl: 1.25 };
        var hrefs = { modern: 'Plus+Jakarta+Sans:wght@400;500;600;700', elegant: 'Fraunces:opsz,wght@9..144,400..700', rounded: 'Nunito:wght@400;500;600;700', serif: 'Newsreader:opsz,wght@6..72,400..700', readable: 'Atkinson+Hyperlegible:wght@400;700', mono: 'JetBrains+Mono:wght@400;500;600;700' };
        var r = document.documentElement;
        r.style.setProperty('--text-scale', sizes[f.size] || 1);
        if (f.style) r.dataset.font = f.style;
        if (f.motion) r.dataset.motion = f.motion;
        if (hrefs[f.style]) document.write('<link id="font-' + f.style + '" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=' + hrefs[f.style] + '&display=swap">');
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <!-- Text: SF Pro on Apple devices, Inter elsewhere (swaps in, never blocks).
       Icons: display=block on purpose, so icon names never flash as plain words. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400..500,0..1,0&display=block"/>
  <link rel="stylesheet" href="app.css?v=40"/>
</head>
<body>
  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="shell">
    <aside class="sidebar" aria-label="Primary">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">AP</div>
        <div>
          <div class="brand-name">ApplyPilot</div>
          <div class="brand-sub">Command center</div>
        </div>
      </div>
      <nav class="nav" id="nav" aria-label="Sections"></nav>
      <div class="engine" id="engine"></div>
    </aside>

    <section class="main">
      <header class="topbar">
        <button class="search-trigger hv refract" id="search-trigger" aria-label="Search jobs and run commands">
          <span class="ms" aria-hidden="true">search</span><span class="lbl">Search jobs, run commands…</span><span class="kbd">Ctrl K</span>
        </button>
        <div class="lcd refract" id="lcd" role="status" aria-live="polite"></div>
        <div class="top-actions capsule refract" id="top-actions"></div>
        <button class="btn icon theme-btn hv refract" id="theme-btn" aria-label="Appearance" title="Appearance" aria-haspopup="dialog" aria-expanded="false"><span class="ms" aria-hidden="true">palette</span></button>
      </header>
      <main class="content" id="content"></main>
    </section>
  </div>

  <nav class="tabbar refract" id="tabbar" aria-label="Tabs"></nav>

  <div class="scrim" id="scrim"></div>
  <aside class="inspector" id="inspector" aria-label="Job detail"></aside>
  <div id="overlay"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="app.js?v=39"></script>
</body>
</html>
