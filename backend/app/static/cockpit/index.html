<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta name="theme-color" content="#000000"/>
  <title>ApplyPilot</title>
  <script>
    // Retire legacy Flutter service workers / caches from earlier builds.
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
    if ('caches' in window) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
    // Apply saved theme before first paint.
    try { const t = localStorage.getItem('ap_theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,300..500,0..1,0&display=block"/>
  <link rel="stylesheet" href="app.css?v=6"/>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Primary">
      <div class="brand">
        <div class="brand-mark">AP</div>
        <div>
          <div class="brand-name">ApplyPilot</div>
          <div class="brand-sub">Command center</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="engine" id="engine"></div>
    </aside>

    <section class="main">
      <header class="topbar">
        <div style="min-width:0">
          <div class="page-title" id="page-title">Today</div>
          <div class="page-sub" id="page-sub"></div>
        </div>
        <div class="spacer"></div>
        <button class="search-trigger" id="search-trigger" aria-label="Search and commands">
          <span class="ms">search</span><span>Search jobs, run commands…</span><span class="kbd">Ctrl K</span>
        </button>
        <div class="desk top-actions" id="top-actions"></div>
        <button class="btn icon ghost" id="theme-btn" title="Toggle theme" aria-label="Toggle theme"><span class="ms">contrast</span></button>
      </header>
      <main class="content" id="content"></main>
    </section>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Tabs"></nav>

  <div class="scrim" id="scrim"></div>
  <aside class="inspector" id="inspector" aria-label="Job detail"></aside>
  <div id="overlay"></div>
  <div class="toasts" id="toasts"></div>

  <script src="app.js?v=6"></script>
</body>
</html>
